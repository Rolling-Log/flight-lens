services:
  - type: web
    name: flight-lens-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    startCommand: pnpm --filter @flight-lens/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_INTENT_PARSER_ENABLED
        value: "false"
      - key: DOMESTIC_BROWSER_CONNECTORS_ENABLED
        value: "false"
      - key: FLYAI_ENABLED
        value: "true"
      - key: CONNECTOR_TIMEOUT_MS
        value: "20000"
      - key: SERPAPI_MONTHLY_CREDIT_CAP
        value: "100"
      - key: MONITOR_BATCH_MAX
        value: "5"
      - key: MONITOR_EXECUTION_TIMEOUT_MS
        value: "45000"
      - key: NTFY_BASE_URL
        value: "https://ntfy.sh"
      - key: WEB_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONITOR_WAKE_SECRET
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: FLYAI_API_KEY
        sync: false
